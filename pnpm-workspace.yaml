packages:
  - "packages/*"

# 允许执行安装脚本的依赖（pnpm 默认全部禁止）。better-sqlite3 需要下载或编译原生模块（T-005）。
# pnpm 12 用 allowBuilds 按依赖名批准（写在 pnpm-workspace.yaml 里），否则原生模块不会编译。
allowBuilds:
  better-sqlite3: true
  electron-winstaller: true

# pnpm 10 及更早版本的等价写法，保留以兼容旧版 pnpm。
onlyBuiltDependencies:
  - better-sqlite3
