<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title"><title id="title">BakaCoding 个人开发超大软件的分层工程闭环</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs><g font-family="Microsoft YaHei, sans-serif" text-anchor="middle"><rect x="12" y="28" width="176" height="94" rx="8" fill="#fff" stroke="#b8c6d5"/><text x="100" y="64" fill="#14253d" font-size="17">个人开发者</text><text x="100" y="94" fill="#64748b" font-size="11">整体目标与关键决策</text><path d="M188 75H206" fill="none" stroke="#64748b" marker-end="url(#a)"/><rect x="212" y="28" width="176" height="94" rx="8" fill="#fff" stroke="#b8c6d5"/><text x="300" y="64" fill="#14253d" font-size="17">工程地图与架构</text><text x="300" y="94" fill="#64748b" font-size="11">子系统 · 模块 · 接口 · 依赖</text><path d="M388 75H406" fill="none" stroke="#64748b" marker-end="url(#a)"/><rect x="412" y="28" width="176" height="94" rx="8" fill="#fff" stroke="#b8c6d5"/><text x="500" y="64" fill="#14253d" font-size="17">里程碑任务图</text><text x="500" y="94" fill="#64748b" font-size="11">影响分析 · 关键路径 · 调度</text><path d="M588 75H606" fill="none" stroke="#64748b" marker-end="url(#a)"/><rect x="612" y="28" width="176" height="94" rx="8" fill="#fff" stroke="#b8c6d5"/><text x="700" y="64" fill="#14253d" font-size="17">受控模块执行</text><text x="700" y="94" fill="#64748b" font-size="11">隔离工作区 · 本机或远程节点</text><path d="M788 75H806" fill="none" stroke="#64748b" marker-end="url(#a)"/><rect x="812" y="28" width="176" height="94" rx="8" fill="#fff" stroke="#b8c6d5"/><text x="900" y="64" fill="#14253d" font-size="17">集成与系统验收</text><text x="900" y="94" fill="#64748b" font-size="11">版本集合 · 契约 · 关键路径</text><rect x="20" y="185" width="960" height="70" rx="8" fill="#edf3fa" stroke="#b8c6d5"/><text x="500" y="213" fill="#14253d" font-size="18">确定性协调器</text><text x="500" y="239" fill="#475569" font-size="15">状态 · 权限 · 资源 · 租约 · 预算 · 恢复 · 证据有效性</text