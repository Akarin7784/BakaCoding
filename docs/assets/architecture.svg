<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 405" role="img" aria-labelledby="maptitle"><title id="maptitle">BakaCoding 从需求到交付的功能闭环及确定性控制机制</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs><g font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle"><g fill="#fff" stroke="#cbd5e1"><rect x="15" y="30" width="170" height="80" rx="9"/><rect x="215" y="30" width="170" height="80" rx="9"/><rect x="415" y="30" width="170" height="80" rx="9"/><rect x="615" y="30" width="170" height="80" rx="9"/><rect x="815" y="30" width="170" height="80" rx="9"/><rect x="15" y="175" width="970" height="72" rx="9" fill="#edf3fa"/><rect x="80" y="305" width="340" height="72" rx="9"/><rect x="580" y="305" width="340" height="72" rx="9"/></g><g fill="#14253d"><text x="100" y="62">需求与知识</text><text x="300" y="62">确认功能契约</text><text x="500" y="62">隔离编码</text><text x="700" y="62">独立验证</text><text x="900" y="62">预览与交付</text><text x="500" y="204" font-weight="bold">本机协调器</text><text x="500" y="231" font-size="15">持久化状态　动作权限　预算预留　证据版本　失败恢复</text><text x="250" y="336">项目事实与原始证据</text><text x="250" y="359" font-size="14">事件　代码版本　日志　验收结果</text><text x="750" y="336">批准知识与复用资产</text><text x="750" y="359" font-size="14">来源　许可　适用范围　失效规则</text></g><g fill="#64748b" font-size="13"><text x="100" y="86">检索来源与当前代码</text><text x="300" y="86">范围　验收　费用</text><text x="500" y="86">独立工作区与运行环境</text><text x="700" y="86">测试与反例形成证据</text><text x="900" y="86">用户接受后受控集成</text></g><g stroke="#64748b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"><path d="M185 70H210"/><path d="M385 70H410"/><path d="M585 70H610"/><path d="M785 70H810"/><path d="M100 175V115"/><path d="M300 175V115"/><path d="M500 175V115"/><path d="M700 175V115"/><path d="M900 175V115"/><path d="M250 247V300"/><path d="M750 305V252"/><path d="M420 341H575"/><path d="M700 111V140H500V115"/></g><text